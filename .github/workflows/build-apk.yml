name: Build Billi Billi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Flutter Android Project
        run: |
          flutter create --platforms=android --org com.billibilli billi_billi_build
          cp main.dart billi_billi_build/lib/main.dart
          cp pubspec.yaml billi_billi_build/pubspec.yaml

      - name: Set Kotlin version
        run: |
          cd billi_billi_build
          sed -i "s/2.1.0/2.3.20/g" android/settings.gradle
          sed -i "s/2.1.0/2.3.20/g" android/build.gradle
          sed -i "s/2.1.0/2.3.20/g" android/gradle.properties

      - name: Get dependencies
        run: |
          cd billi_billi_build
          flutter pub get

      - name: Build APK
        run: |
          cd billi_billi_build
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Billi-Billi-APK
          path: billi_billi_build/build/app/outputs/flutter-apk/app-release.apk
