name: Build Billi Billi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name billi_billi \
            --org com.billibilli \
            .

      - name: Configure Android package and permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_package = "com.billibilli.billi_billi"
          new_package = "com.billibilli.video"

          for p in Path("android").rglob("*"):
              if not p.is_file():
                  continue

              try:
                  text = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              if old_package in text:
                  p.write_text(
                      text.replace(old_package, new_package),
                      encoding="utf-8"
                  )

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          manifest_start = (
              '<manifest '
              'xmlns:android="http://schemas.android.com/apk/res/android">'
          )

          if manifest_start not in text:
              raise SystemExit(
                  "AndroidManifest.xml manifest tag not found"
              )

          permissions = [
              '<uses-permission '
              'android:name="android.permission.CAMERA" />',
              '<uses-permission '
              'android:name="android.permission.INTERNET" />',
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      manifest_start,
                      manifest_start + "\n    " + permission,
                      1
                  )

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Billi-Billi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
